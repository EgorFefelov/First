<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой курс</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="stage">
    <div id="tabs-area">
      <button class="tab-btn tab-active" data-tab="gallery" type="button">Галерея</button>
      <button class="tab-btn" data-tab="comic" type="button">Комикс</button>
      <button class="tab-btn" data-tab="game"  type="button">Игра</button>
      <button class="tab-btn" data-tab="site"  type="button">Сайт</button>
    </div>
    <div id="board-area">
      <div id="tab-gallery">
        <div id="hero-area"></div>
        <div id="gallery-area"></div>
      </div>
      <div id="tab-comic" hidden>
        <iframe id="comic-frame" class="project-frame" title="Мой комикс"></iframe>
      </div>
      <!-- Игра и Сайт — встраиваем оригиналы из projects/ через iframe (один источник правды,
           тот же файл, что поедет на прод). src проставляется лениво из tabs.js при первом
           открытии таба — чтобы не грузить проекты, которых ещё нет. -->
      <div id="tab-game" hidden>
        <iframe id="game-frame" class="project-frame" title="Моя игра"></iframe>
      </div>
      <div id="tab-site" hidden>
        <iframe id="site-frame" class="project-frame" title="Мой сайт"></iframe>
      </div>
    </div>
  </div>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/bubble.js"></script>
  <script src="assets/js/hero.js"></script>
  <script src="assets/js/tabs.js"></script>
  <script src="assets/js/board.js"></script>
</body>
</html>
